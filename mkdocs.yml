site_name: dimma — DP-SGD Projects
site_url: https://larraguibel.github.io/dimma/
docs_dir: mkdocs

theme:
  name: material

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css

nav:
  - DP-SGD Projects: index.md
  - "Differential Privacy for SGD: Overview": overview.md
  - Jax, Flax and Other DP-SGD Libraries: tooling.md
  - "dimma: the library": library.md
  - Algorithms:
      - Algorithms: algorithms/index.md
      - Private Spider-Boost:
          - Private Spider-Boost: algorithms/spiderboost/index.md
          - Differences between theory and implementation: algorithms/spiderboost/theory-vs-implementation.md
          - "Implementation notes (heuristics, deferred decisions)": algorithms/spiderboost/implementation-notes.md
          - The q-invariance of params_random: algorithms/spiderboost/q-invariance.md
  - Next steps: next-steps.md
